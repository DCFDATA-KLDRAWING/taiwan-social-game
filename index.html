<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺灣島嶼時空開拓記 - 國小五年級社會科探險</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js 音效支援 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- Lucide 圖標庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .water-bg {
      background: radial-gradient(circle at 50% 50%, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
    }
    /* 木質 PaGamO 風格邊框 */
    .wood-board {
      background: #78350f;
      border: 4px solid #b45309;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }
    .parchment {
      background-color: #fef3c7;
      border: 3px solid #d97706;
      box-shadow: inset 0 0 15px rgba(180, 83, 9, 0.2);
    }
    /* 彈窗入場動畫 */
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-900 text-slate-800">

  <!-- 頂部即時狀態欄 -->
  <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-3 py-2 bg-slate-900/80 backdrop-blur-md border-b border-amber-500/30 text-white">
    <div class="flex items-center gap-2">
      <div class="bg-amber-600 p-1.5 rounded-lg text-white shadow">
        <i data-lucide="map" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base tracking-wide flex items-center gap-1.5 text-amber-200">
          臺灣時空開拓記

        </h1>
        <p class="text-[10px] text-slate-300 hidden sm:block">國小五上社會科：地理板塊・史前生活・多元族群與法治</p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-4 text-xs font-semibold">
      <div class="flex items-center gap-1 bg-sky-950/80 border border-sky-400/40 px-2.5 py-1 rounded-full text-sky-200" title="甘霖水滴（答對累積，可用於耕種升級）">
        <i data-lucide="droplet" class="w-4 h-4 text-sky-400"></i>
        <span id="waterCount">0</span>
      </div>
      <div class="flex items-center gap-1 bg-emerald-950/80 border border-emerald-400/40 px-2.5 py-1 rounded-full text-emerald-200" title="已佔領土地">
        <i data-lucide="trees" class="w-4 h-4 text-emerald-400"></i>
        <span id="landCount">1</span>
      </div>
      <div class="flex items-center gap-1 bg-amber-950/80 border border-amber-400/40 px-2.5 py-1 rounded-full text-amber-200" title="連續答對題數（每5題天降甘霖）">
        <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i>
        <span id="streakCount">0/5</span>
      </div>
    </div>

    <!-- 輔助按鈕組 -->
    <div class="flex items-center gap-1.5">
      <button id="btnVoiceToggle" class="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-amber-300 transition" title="語音朗讀切換">
        <i data-lucide="volume-2" class="w-4 h-4"></i>
      </button>
      <button id="btnNotebook" class="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-amber-300 transition" title="錯題與複習筆記">
        <i data-lucide="book-open" class="w-4 h-4"></i>
      </button>
      <button id="btnReset" class="p-2 rounded-lg bg-red-950/80 border border-red-500/50 hover:bg-red-900 text-red-200 transition" title="重置島嶼紀錄">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 大海與六角島嶼畫布 Canvas -->
  <main class="relative w-full h-full water-bg">
    <canvas id="gameCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

    <!-- 浮動提示小地圖說明 -->
    <div class="absolute bottom-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md border border-amber-500/30 text-white p-3 rounded-xl max-w-xs text-xs pointer-events-none">
      <p class="font-bold text-amber-300 flex items-center gap-1">
        <i data-lucide="compass" class="w-4 h-4"></i> 開拓指南
      </p>
      <p class="text-slate-300 mt-1 leading-relaxed">
        點擊相鄰的 <span class="text-sky-300 font-bold">海洋/野地</span> 啟動題目任務！答對即可拓殖為新領地；點擊 <span class="text-emerald-300 font-bold">自有土地</span> 進行食衣住行建設與種植。
      </p>
    </div>
  </main>

  <!-- 答題任務木質護盾視窗 (PaGamO 拓墾彈窗) -->
  <div id="modalQuiz" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">

      <div class="flex items-center justify-between border-b border-amber-600/50 pb-2 mb-3">

        </div>

          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> 課文語音
        </button>

      </div>

      <div id="quizOptions" class="grid grid-cols-1 gap-2.5 mb-4">
        <!-- 動態選項 -->
      </div>

      <div id="quizFeedback" class="hidden p-3 rounded-lg text-xs leading-relaxed mb-3"></div>

      <div class="flex justify-end gap-2">
        <button id="btnQuitQuiz" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">放棄返回</button>

      </div>
    </div>
  </div>

    </div>
  </div>

    /* ==========================================================================
       4. 六角網格幾何運算與互動 (Hexagon Grid Math)
       ========================================================================== */
    const HEX_RADIUS = 48; // 六角形半徑
    const HEX_WIDTH = Math.sqrt(3) * HEX_RADIUS;
    const HEX_HEIGHT = 2 * HEX_RADIUS;

    // 軸向座標 (q, r) 轉 Canvas 平面座標 (x, y)
    function hexToPixel(q, r, centerX, centerY) {
      const x = centerX + HEX_RADIUS * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
      const y = centerY + HEX_RADIUS * (3 / 2 * r);
      return { x, y };
    }

    // 取得相鄰的 6 個方向
    const HEX_DIRECTIONS = [
      { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
      { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }
    ];

    function getNeighbors(q, r) {
      return HEX_DIRECTIONS.map(d => ({ q: q + d.q, r: r + d.r }));
    }

    // 取得所有「可供開拓」的相鄰野地/海洋
    function getAvailableTargets() {
      const targets = {};
      Object.keys(gameState.hexes).forEach(key => {
        const h = gameState.hexes[key];
        if (h.owned) {
          getNeighbors(h.q, h.r).forEach(n => {
            const nKey = `${n.q},${n.r}`;
            if (!gameState.hexes[nKey] || !gameState.hexes[nKey].owned) {
              targets[nKey] = n;
            }
          });
        }
      });
      return targets;
    }

    /* ==========================================================================
       5. 畫布繪製與動畫 Canvas Renderer
       ========================================================================== */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let cameraOffset = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let hoveredHex = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawMap();
    }
    window.addEventListener("resize", resizeCanvas);

    function drawHexagon(ctx, x, y, radius, fillStyle, strokeStyle, lineWidth = 2) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i + Math.PI / 6;
        const hx = x + radius * Math.cos(angle);
        const hy = y + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }
    }

    // 繪製建築與生活圖騰
    function drawBuildingIcon(ctx, x, y, buildingType, era) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // 繪製地性格底襯小徽記
      if (buildingType === "cave") {
        ctx.font = "24px sans-serif";
        ctx.fillText("⛰️", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#fef3c7";
        ctx.fillText("海蝕岩洞", x, y + 15);
      } else if (buildingType === "fire") {
        ctx.font = "24px sans-serif";
        ctx.fillText("🔥", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#fed7aa";
        ctx.fillText("採集生火", x, y + 15);
      } else if (buildingType === "stilt_house") {
        ctx.font = "24px sans-serif";
        ctx.fillText("🛖", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#dcfce7";
        ctx.fillText("干欄高架", x, y + 15);
      } else if (buildingType === "pottery_kiln") {
        ctx.font = "24px sans-serif";
        ctx.fillText("🏺", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#fed7aa";
        ctx.fillText("繩紋陶窯", x, y + 15);
      } else if (buildingType === "iron_forge") {
        ctx.font = "24px sans-serif";
        ctx.fillText("⚒️", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#fed7aa";
        ctx.fillText("高溫煉鐵", x, y + 15);
      } else if (buildingType === "trade_port") {
        ctx.font = "24px sans-serif";
        ctx.fillText("⛵", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#bae6fd";
        ctx.fillText("商貿碼頭", x, y + 15);
      } else if (buildingType === "civic_court") {
        ctx.font = "24px sans-serif";
        ctx.fillText("⚖️", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#e0e7ff";
        ctx.fillText("國民法庭", x, y + 15);
      } else if (buildingType === "rail_transit") {
        ctx.font = "24px sans-serif";
        ctx.fillText("🚄", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#bae6fd";
        ctx.fillText("高鐵樞紐", x, y + 15);
      } else {
        // 一般耕地或預設林地
        ctx.font = "22px sans-serif";
        ctx.fillText("🌾", x, y - 6);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#ecfdf5";
        ctx.fillText("開墾沃土", x, y + 15);
      }
      ctx.restore();
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2 + cameraOffset.x;
      const centerY = canvas.height / 2 + cameraOffset.y;

      // 繪製背景動態微波浪光影
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 2;
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(canvas.width / 3, y + 10, (canvas.width * 2) / 3, y - 10, canvas.width, y);
        ctx.stroke();
      }
      ctx.restore();

      const targets = getAvailableTargets();

      // 1. 繪製可開拓野地（水面上微光的問號地格）
      Object.keys(targets).forEach(key => {
        const { q, r } = targets[key];
        const { x, y } = hexToPixel(q, r, centerX, centerY);
        const isHover = hoveredHex && hoveredHex.q === q && hoveredHex.r === r && hoveredHex.isTarget;

        drawHexagon(
          ctx, x, y, HEX_RADIUS - 2,
          isHover ? "rgba(56, 189, 248, 0.45)" : "rgba(14, 116, 144, 0.35)",
          isHover ? "#38bdf8" : "rgba(56, 189, 248, 0.5)",
          isHover ? 3 : 1.5
        );

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 16px sans-serif";
        ctx.fillStyle = isHover ? "#ffffff" : "#bae6fd";
        ctx.fillText("⚔️", x, y - 4);
        ctx.font = "10px sans-serif";
        ctx.fillText("拓墾", x, y + 14);
        ctx.restore();
      });

      // 2. 繪製玩家已佔領的土地島嶼
      Object.keys(gameState.hexes).forEach(key => {
        const hex = gameState.hexes[key];
        if (!hex.owned) return;
        const { x, y } = hexToPixel(hex.q, hex.r, centerX, centerY);
        const isHover = hoveredHex && hoveredHex.q === hex.q && hoveredHex.r === hex.r && !hoveredHex.isTarget;

        // 依據時代給予不同沃土色澤
        let landColor = "#15803d"; // 綠意
        let strokeColor = "#4ade80";
        if (hex.era === "paleolithic") {
          landColor = "#854d0e";
          strokeColor = "#facc15";
        } else if (hex.era === "metal") {
          landColor = "#9a3412";
          strokeColor = "#fb923c";
        } else if (hex.era === "modern") {
          landColor = "#1e40af";
          strokeColor = "#60a5fa";
        }

        // 六角地格陰影
        drawHexagon(ctx, x, y + 4, HEX_RADIUS - 1, "rgba(0,0,0,0.35)", null);
        drawHexagon(ctx, x, y, HEX_RADIUS - 2, landColor, isHover ? "#ffffff" : strokeColor, isHover ? 3.5 : 2);

        // 繪製圖騰與標籤
        drawBuildingIcon(ctx, x, y, hex.building, hex.era);
      });
    }

    /* ==========================================================================
       6. 畫布點擊判定與相機拖曳控制 (Mouse & Touch Events)
       ========================================================================== */
    function getHexAtPixel(px, py) {
      const centerX = canvas.width / 2 + cameraOffset.x;
      const centerY = canvas.height / 2 + cameraOffset.y;
      const targets = getAvailableTargets();

      // 先搜尋已擁有地格
      for (let key in gameState.hexes) {
        const h = gameState.hexes[key];
        const { x, y } = hexToPixel(h.q, h.r, centerX, centerY);
        const dist = Math.hypot(px - x, py - y);
        if (dist <= HEX_RADIUS) {
          return { ...h, isTarget: false };
        }
      }

      // 再搜尋可開拓野地
      for (let key in targets) {
        const t = targets[key];
        const { x, y } = hexToPixel(t.q, t.r, centerX, centerY);
        const dist = Math.hypot(px - x, py - y);
        if (dist <= HEX_RADIUS) {
          return { ...t, isTarget: true };
        }
      }
      return null;
    }

    canvas.addEventListener("mousedown", e => {
      isDragging = true;
      dragStart = { x: e.clientX - cameraOffset.x, y: e.clientY - cameraOffset.y };
    });

    window.addEventListener("mousemove", e => {
      if (isDragging) {
        cameraOffset.x = e.clientX - dragStart.x;
        cameraOffset.y = e.clientY - dragStart.y;
        drawMap();
      } else {
        const h = getHexAtPixel(e.clientX, e.clientY);
        if (JSON.stringify(h) !== JSON.stringify(hoveredHex)) {
          hoveredHex = h;
          drawMap();
        }
      }
    });

    window.addEventListener("mouseup", e => {
      if (!isDragging) return;
      isDragging = false;
    });

    // 點擊事件
    canvas.addEventListener("click", e => {
      const h = getHexAtPixel(e.clientX, e.clientY);
      if (!h) return;

      playSfx("click");

      if (h.isTarget) {
        // 點擊野地 -> 觸發開拓答題
        openQuizModal(h.q, h.r);
      } else {
        // 點擊已有土地 -> 打開食衣住行營造視窗
        openBuildModal(h.q, h.r);
      }
    });

    // 平板手勢支援
    canvas.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStart = { x: e.touches[0].clientX - cameraOffset.x, y: e.touches[0].clientY - cameraOffset.y };
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", e => {
      if (isDragging && e.touches.length === 1) {
        cameraOffset.x = e.touches[0].clientX - dragStart.x;
        cameraOffset.y = e.touches[0].clientY - dragStart.y;
        drawMap();
      }
    }, { passive: true });

    canvas.addEventListener("touchend", () => {
      isDragging = false;
    });

    /* ==========================================================================
       7. 答題任務與語音互動模組
       ========================================================================== */
    let currentQuizTarget = null;
    let currentQuestion = null;
    let voiceEnabled = true;

    function playSfx(type) {
      try {
        if (!Tone || Tone.context.state !== "running") Tone.start();
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -10;
        if (type === "correct") {
          synth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
        } else if (type === "wrong") {
          synth.triggerAttackRelease(["Eb4", "D4"], "8n");
        } else if (type === "click") {
          synth.triggerAttackRelease(["C4"], "16n");
        } else if (type === "era") {
          synth.triggerAttackRelease(["C4", "G4", "C5", "E5"], "4n");
        }
      } catch (err) {}
    }

    // 智能優化語音合成 (TTS)
    function speakText(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-TW";
      utter.rate = 0.95; // 適合小學生的清晰語速

      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang.includes("zh-TW") || v.lang.includes("cmn-Hant-TW") || v.name.includes("Taiwan") || v.name.includes("Mei-Jia"));
      if (twVoice) utter.voice = twVoice;

      window.speechSynthesis.speak(utter);
    }

    function openQuizModal(q, r) {
      currentQuizTarget = { q, r };

      // 依當前時代優先抽該時代題目，並混合地理與公民題目
      const filtered = QUESTION_BANK.filter(item => item.era === gameState.era || item.era === "geography" || item.era === "modern");
      currentQuestion = filtered[Math.floor(Math.random() * filtered.length)];

      document.getElementById("quizChapterBadge").textContent = currentQuestion.chapter;
      document.getElementById("quizEraHint").textContent = `【${ERA_CONFIG[gameState.era].name}】時空考驗`;
      document.getElementById("quizQuestion").textContent = currentQuestion.q;

      const optsContainer = document.getElementById("quizOptions");
      optsContainer.innerHTML = "";
      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3 rounded-xl bg-amber-900/40 hover:bg-amber-800/60 border border-amber-600/40 font-medium text-xs sm:text-sm text-amber-100 transition flex items-center gap-2";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-amber-600 flex items-center justify-center text-xs font-bold shrink-0">${['A', 'B', 'C', 'D'][idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => submitAnswer(idx, btn);
        optsContainer.appendChild(btn);
      });

      const fb = document.getElementById("quizFeedback");
      fb.className = "hidden";
      fb.innerHTML = "";
      document.getElementById("btnConfirmQuiz").classList.add("hidden");
      document.getElementById("modalQuiz").classList.remove("hidden");

      // 自動朗讀題目
      speakText(`${currentQuestion.q}。選項有：A, ${currentQuestion.options[0]}。B, ${currentQuestion.options[1]}。C, ${currentQuestion.options[2]}。D, ${currentQuestion.options[3]}`);
    }

    function submitAnswer(chosenIdx, chosenBtn) {
      const isCorrect = chosenIdx === currentQuestion.ans;
      const fb = document.getElementById("quizFeedback");
      fb.classList.remove("hidden");

      // 鎖定所有選項
      const allBtns = document.getElementById("quizOptions").querySelectorAll("button");
      allBtns.forEach((b, i) => {
        b.disabled = true;
        if (i === currentQuestion.ans) {
          b.classList.remove("bg-amber-900/40");
          b.classList.add("bg-emerald-600", "border-emerald-400", "text-white");
        } else if (i === chosenIdx) {
          b.classList.remove("bg-amber-900/40");
          b.classList.add("bg-red-600", "border-red-400", "text-white");
        }
      });

      if (isCorrect) {
        playSfx("correct");
        gameState.streak += 1;
        gameState.water += 1;

        let bonusText = "";
        // 連續答對 5 題觸發大甘霖
        if (gameState.streak >= 5) {
          gameState.streak = 0;
          gameState.water += 3;
          bonusText = "🎉 連續答對 5 題！天降甘霖，額外獲得 +3 甘霖水滴！";
        }

        fb.className = "p-3 rounded-lg text-xs leading-relaxed mb-3 bg-emerald-950/80 border border-emerald-500 text-emerald-200";
        fb.innerHTML = `<strong>答對了！恭喜成功開拓領土！</strong><br>${currentQuestion.explanation}<br><span class="text-amber-300 font-bold">${bonusText}</span>`;
        speakText(`答對了！${currentQuestion.explanation}`);

        // 將土地加入已佔有
        const key = `${currentQuizTarget.q},${currentQuizTarget.r}`;
        gameState.hexes[key] = {
          q: currentQuizTarget.q,
          r: currentQuizTarget.r,
          owned: true,
          building: "farm",
          era: gameState.era,
          level: 1
        };

        checkEraProgression();
        saveGame();
        drawMap();

        document.getElementById("btnConfirmQuiz").classList.remove("hidden");
        document.getElementById("btnConfirmQuiz").onclick = () => {
          document.getElementById("modalQuiz").classList.add("hidden");
        };
      } else {
        playSfx("wrong");
        gameState.streak = 0;
        fb.className = "p-3 rounded-lg text-xs leading-relaxed mb-3 bg-red-950/80 border border-red-500 text-red-200";
        fb.innerHTML = `<strong>答錯了，土地開墾受到阻礙！</strong><br>${currentQuestion.explanation}`;
        speakText(`這題答錯囉。重點解析：${currentQuestion.explanation}`);

        // 加入易錯筆記
        if (!gameState.mistakes.find(m => m.id === currentQuestion.id)) {
          gameState.mistakes.push(currentQuestion);
          saveGame();
        }

        document.getElementById("btnConfirmQuiz").classList.remove("hidden");
        document.getElementById("btnConfirmQuiz").textContent = "收下重點筆記";
        document.getElementById("btnConfirmQuiz").onclick = () => {
          document.getElementById("modalQuiz").classList.add("hidden");
        };
      }
      updateUI();
    }

    // 檢查時代演進
    function checkEraProgression() {
      const ownedCount = Object.values(gameState.hexes).filter(h => h.owned).length;
      const currentConfig = ERA_CONFIG[gameState.era];

      if (currentConfig.next && ownedCount >= currentConfig.reqLands) {
        const nextEra = currentConfig.next;
        gameState.era = nextEra;
        playSfx("era");
        alert(`🌟 時代大躍進！\n恭喜你開拓了 ${ownedCount} 塊土地，正式帶領臺灣島邁向【${ERA_CONFIG[nextEra].name}】！\n現在可以解鎖更多「食衣住行育樂」歷史建築與精美工藝！`);
      }
    }

    /* ==========================================================================
       8. 土地營造視窗 (加蓋食衣住行育樂建築)
       ========================================================================== */
    let currentBuildTarget = null;

    function openBuildModal(q, r) {
      currentBuildTarget = { q, r };
      const key = `${q},${r}`;
      const currentHex = gameState.hexes[key];
      const eraData = ERA_CONFIG[gameState.era];

      const listContainer = document.getElementById("buildOptionsList");
      listContainer.innerHTML = "";

      eraData.buildings.forEach(b => {
        const item = document.createElement("div");
        item.className = "p-3 rounded-xl bg-amber-900/30 border border-amber-600/40 hover:border-amber-400 transition flex flex-col justify-between";
        item.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="font-bold text-amber-200 text-sm">${b.name}</span>
              <span class="text-[10px] bg-amber-700/60 px-1.5 py-0.5 rounded text-amber-100">${b.category}</span>
            </div>
            <p class="text-[11px] text-slate-300 mb-2">${b.benefit}</p>
          </div>
          <button class="w-full py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 font-bold text-xs text-white flex items-center justify-center gap-1 transition ${gameState.water < b.cost ? 'opacity-50 cursor-not-allowed' : ''}">
            <i data-lucide="droplet" class="w-3.5 h-3.5"></i> 消耗 ${b.cost} 甘霖建造
          </button>
        `;

        const btn = item.querySelector("button");
        btn.onclick = () => {
          if (gameState.water < b.cost) {
            alert("甘霖水滴不足！請先開拓野地答對題目累積水滴。");
            return;
          }
          gameState.water -= b.cost;
          gameState.hexes[key].building = b.type;
          gameState.hexes[key].era = gameState.era;
          playSfx("correct");
          saveGame();
          drawMap();
          document.getElementById("modalBuild").classList.add("hidden");
          lucide.createIcons();
        };

        listContainer.appendChild(item);
      });

      document.getElementById("modalBuild").classList.remove("hidden");
      lucide.createIcons();
    }

    /* ==========================================================================
       9. 課文重點與錯題筆記本視窗
       ========================================================================== */
    const SUMMARY_TEXTS = [
      {
        title: "第一單元：1-1 鳥瞰臺灣",
        content: "經緯度：東經120°~122°、北緯22°~25°。北回歸線(23.5°N)穿越嘉義、花蓮，為熱帶與副熱帶分界。四周環海：西臨臺灣海峽、東臨太平洋、南臨巴士海峽、北臨東海。地處東亞島弧樞紐與國際貿易要道。"
      },
      {
        title: "第一單元：1-2 海中誕生的家園",
        content: "板塊運動：菲律賓海板塊與歐亞板塊擠壓隆起形成。五大地形：山地(占2/3五大山脈)、平原(嘉南平原農業繁榮)、盆地(四周高中間低)、台地與丘陵。離島成因：金門馬祖為大陸島；澎湖綠島蘭嶼為火山島；小琉球為珊瑚礁島。"
      },
      {
        title: "第一單元：1-3 史前時代三部曲",
        content: "舊石器時代(長濱文化)：已知用火、住海蝕洞、敲打打製石器、移居採集。新石器時代(大坌坑、卑南、圓山)：原始農業定居、繩紋陶器儲糧、精細磨製石器。金屬器時代(十三行文化)：高溫煉鐵、發達海上商貿與外來玻璃青銅交換。"
      },
      {
        title: "第二單元：2-1 島嶼上的子民",
        content: "多元族群：南島語族臺灣原住民族(高山與平埔族群)。傳統領域與敬畏祖靈(豐年祭、矮靈祭、飛魚祭)。社會制度：父系(泰雅、布農)、母系(阿美、卑南)、貴族社會(排灣、魯凱)。漢人帶來民間信仰(媽祖、保生大帝)與父系宗祠族譜。"
      },
      {
        title: "第二單元：2-2 社會規範與現代法律",
        content: "四大規範：風俗習慣、倫理道德、宗教信仰、法律。法律是唯一具有「國家強制力」的規範，用以維護人權與社會正義。現代民主推動「國民法官」制度參與審判，與時俱進落實法治。"
      }
    ];

    function openNotebookModal() {
      renderNotebookTab("summary");
      document.getElementById("modalNotebook").classList.remove("hidden");
    }

    function renderNotebookTab(tab) {
      const container = document.getElementById("notebookContent");
      container.innerHTML = "";
      document.getElementById("mistakeBadge").textContent = gameState.mistakes.length;

      if (tab === "summary") {
        document.getElementById("tabSummary").className = "px-4 py-2 font-bold text-amber-400 border-b-2 border-amber-400";
        document.getElementById("tabMistakes").className = "px-4 py-2 font-bold text-slate-400 hover:text-slate-200";

        SUMMARY_TEXTS.forEach(s => {
          const card = document.createElement("div");
          card.className = "parchment p-3 rounded-xl text-slate-900";
          card.innerHTML = `
            <div class="flex items-center justify-between mb-1">
              <h4 class="font-bold text-amber-900">${s.title}</h4>
              <button class="text-xs bg-amber-700 hover:bg-amber-800 text-white px-2 py-0.5 rounded flex items-center gap-1">
                <i data-lucide="volume-2" class="w-3 h-3"></i> 朗讀
              </button>
            </div>
            <p class="text-xs leading-relaxed text-slate-800">${s.content}</p>
          `;
          card.querySelector("button").onclick = () => speakText(`${s.title}。${s.content}`);
          container.appendChild(card);
        });
      } else {
        document.getElementById("tabSummary").className = "px-4 py-2 font-bold text-slate-400 hover:text-slate-200";
        document.getElementById("tabMistakes").className = "px-4 py-2 font-bold text-amber-400 border-b-2 border-amber-400";

        if (gameState.mistakes.length === 0) {
          container.innerHTML = `<div class="text-center py-8 text-slate-400">目前沒有錯題紀錄，太厲害了！繼續保持！</div>`;
        } else {
          gameState.mistakes.forEach(m => {
            const card = document.createElement("div");
            card.className = "p-3 rounded-xl bg-red-950/40 border border-red-500/40 text-slate-200";
            card.innerHTML = `
              <div class="text-xs text-red-300 font-bold mb-1">${m.chapter}</div>
              <div class="font-semibold text-xs mb-1 text-white">${m.q}</div>
              <div class="text-[11px] text-emerald-300 mb-1">正確解答：${m.options[m.ans]}</div>
              <div class="text-[11px] text-slate-300 leading-normal">${m.explanation}</div>
            `;
            container.appendChild(card);
          });
        }
      }
      lucide.createIcons();
    }

    /* ==========================================================================
       10. 介面同步更新與按鈕綁定
       ========================================================================== */
    function updateUI() {
      const owned = Object.values(gameState.hexes).filter(h => h.owned).length;
      document.getElementById("waterCount").textContent = gameState.water;
      document.getElementById("landCount").textContent = owned;
      document.getElementById("streakCount").textContent = `${gameState.streak}/5`;
      document.getElementById("currentEraBadge").textContent = ERA_CONFIG[gameState.era].name;
      document.getElementById("mistakeBadge").textContent = gameState.mistakes.length;
    }

    // 朗讀當前題目按鈕
    document.getElementById("btnReadQuestion").onclick = () => {
      if (currentQuestion) {
        speakText(`${currentQuestion.q}。選項有：A, ${currentQuestion.options[0]}。B, ${currentQuestion.options[1]}。C, ${currentQuestion.options[2]}。D, ${currentQuestion.options[3]}`);
      }
    };

    // 語音全域開關
    document.getElementById("btnVoiceToggle").onclick = () => {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById("btnVoiceToggle");
      if (voiceEnabled) {
        btn.innerHTML = `<i data-lucide="volume-2" class="w-4 h-4 text-amber-300"></i>`;
        speakText("已開啟語音教學朗讀功能");
      } else {
        window.speechSynthesis.cancel();
        btn.innerHTML = `<i data-lucide="volume-x" class="w-4 h-4 text-slate-500"></i>`;
      }
      lucide.createIcons();
    };

    document.getElementById("btnReset").onclick = resetGame;
    document.getElementById("btnQuitQuiz").onclick = () => {
      document.getElementById("modalQuiz").classList.add("hidden");
    };
    document.getElementById("btnCloseBuild").onclick = () => {
      document.getElementById("modalBuild").classList.add("hidden");
    };
    document.getElementById("btnNotebook").onclick = openNotebookModal;
    document.getElementById("btnCloseNotebook").onclick = () => {
      document.getElementById("modalNotebook").classList.add("hidden");
    };
    document.getElementById("tabSummary").onclick = () => renderNotebookTab("summary");
    document.getElementById("tabMistakes").onclick = () => renderNotebookTab("mistakes");

    // 初始化載入
    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadGame();
      resizeCanvas();
    });
  </script>
</body>
</html>
