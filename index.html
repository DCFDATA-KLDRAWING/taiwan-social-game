<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>臺灣島嶼時空開拓記 - 國小五年級社會科探險</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js 音效支援 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- Lucide 圖標庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .water-bg {
      background: radial-gradient(circle at 50% 50%, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
    }
    .wood-board {
      background: #78350f;
      border: 3px solid #b45309;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }
    .parchment {
      background-color: #fef3c7;
      border: 2px solid #d97706;
      box-shadow: inset 0 0 10px rgba(180, 83, 9, 0.15);
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden bg-slate-900 text-slate-800 flex flex-col">

  <!-- 頂部即時狀態欄 (雙層自適應架構，永不折行) -->
  <header class="relative z-20 bg-slate-900/90 backdrop-blur-md border-b border-amber-500/30 text-white px-3 py-1.5 shrink-0">
    <!-- 第一行：名稱與功能鍵 -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <span class="bg-amber-600 p-1 rounded-md text-white shadow shrink-0">
          <i data-lucide="map" class="w-4 h-4"></i>
        </span>
        <span class="font-bold text-xs sm:text-base tracking-wide text-amber-200">臺灣時空開拓記</span>
        <span id="currentEraBadge" class="text-[10px] bg-amber-500/20 border border-amber-400 text-amber-300 px-1.5 py-0.2 rounded-full whitespace-nowrap">舊石器時代</span>
      </div>

      <div class="flex items-center gap-1">
        <button id="btnVoiceToggle" class="p-1.5 rounded-lg bg-slate-800 border border-slate-700 active:bg-slate-700 text-amber-300 transition" title="語音開關">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnNotebook" class="p-1.5 rounded-lg bg-slate-800 border border-slate-700 active:bg-slate-700 text-amber-300 transition" title="重點與筆記">
          <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnReset" class="p-1.5 rounded-lg bg-red-950/80 border border-red-500/50 active:bg-red-900 text-red-200 transition" title="重新開始">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 第二行：數值狀態列 -->
    <div class="flex items-center justify-between gap-1 mt-1 text-[11px] font-semibold">
      <div class="flex-1 flex items-center justify-center gap-1 bg-sky-950/80 border border-sky-400/40 py-0.5 rounded-md text-sky-200">
        <i data-lucide="droplet" class="w-3 h-3 text-sky-400 shrink-0"></i>
        <span>甘霖 <strong id="waterCount" class="text-sky-300">0</strong></span>
      </div>
      <div class="flex-1 flex items-center justify-center gap-1 bg-emerald-950/80 border border-emerald-400/40 py-0.5 rounded-md text-emerald-200">
        <i data-lucide="trees" class="w-3 h-3 text-emerald-400 shrink-0"></i>
        <span>領地 <strong id="landCount" class="text-emerald-300">1</strong></span>
      </div>
      <div class="flex-1 flex items-center justify-center gap-1 bg-amber-950/80 border border-amber-400/40 py-0.5 rounded-md text-amber-200">
        <i data-lucide="zap" class="w-3 h-3 text-amber-400 shrink-0"></i>
        <span>連勝 <strong id="streakCount" class="text-amber-300">0/5</strong></span>
      </div>
    </div>
  </header>

  <!-- 大海畫布 Canvas -->
  <main class="relative flex-1 w-full h-full water-bg overflow-hidden">
    <canvas id="gameCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

    <!-- 底部開拓指南浮鈕 -->
    <div class="absolute bottom-3 left-3 z-10">
      <button id="btnToggleGuide" class="flex items-center gap-1 bg-slate-900/80 backdrop-blur-md border border-amber-500/40 text-amber-300 px-2.5 py-1.5 rounded-full text-xs font-bold shadow-lg">
        <i data-lucide="compass" class="w-3.5 h-3.5"></i> 開拓指南
      </button>
      <div id="guidePopover" class="hidden mt-2 bg-slate-900/95 border border-amber-500/40 text-slate-200 p-2.5 rounded-xl text-[11px] max-w-xs leading-relaxed shadow-2xl">
        點擊相鄰的 <span class="text-sky-300 font-bold">海洋/野地</span> 啟動題目任務！答對即可拓殖為新領地；點擊 <span class="text-emerald-300 font-bold">自有土地</span> 可進行食衣住行建設與種植。
      </div>
    </div>
  </main>

  <!-- 答題任務木質護盾視窗 -->
  <div id="modalQuiz" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/75 backdrop-blur-sm hidden">
    <div class="wood-board w-full max-w-md max-h-[92dvh] flex flex-col rounded-2xl p-3.5 text-white shadow-2xl animate-pop relative">
      <div class="flex items-center justify-between border-b border-amber-600/50 pb-1.5 mb-2 shrink-0">
        <div class="flex items-center gap-1.5">
          <span class="bg-amber-600 px-2 py-0.5 rounded text-[11px] font-bold text-amber-100 flex items-center gap-1">
            <i data-lucide="shield-alert" class="w-3 h-3"></i> 任務
          </span>
          <span id="quizChapterBadge" class="text-xs text-amber-300 font-semibold truncate max-w-[140px]">單元 1-1</span>
        </div>
        <button id="btnReadQuestion" class="flex items-center gap-1 bg-amber-700/80 px-2 py-0.5 rounded text-[11px] text-amber-200 transition">
          <i data-lucide="volume-2" class="w-3 h-3"></i> 朗讀
        </button>
      </div>

      <div class="overflow-y-auto flex-1 pr-1 space-y-2.5">
        <div class="parchment rounded-xl p-2.5 text-slate-900">
          <div class="text-[10px] font-bold text-amber-800" id="quizEraHint">時空考驗</div>
          <h3 id="quizQuestion" class="text-sm font-bold leading-snug">載入問題中...</h3>
        </div>

        <div id="quizOptions" class="grid grid-cols-1 gap-2"></div>
        <div id="quizFeedback" class="hidden p-2.5 rounded-lg text-xs leading-relaxed"></div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-amber-700/40 shrink-0">
        <button id="btnQuitQuiz" class="px-3 py-1.5 rounded-xl bg-slate-800 text-xs font-semibold text-slate-300">放棄返回</button>
        <button id="btnConfirmQuiz" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-xs font-bold text-white shadow hidden">完成</button>
      </div>
    </div>
  </div>

  <!-- 土地營造視窗 -->
  <div id="modalBuild" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/75 backdrop-blur-sm hidden">
    <div class="wood-board w-full max-w-md max-h-[90dvh] flex flex-col rounded-2xl p-3.5 text-white shadow-2xl animate-pop">
      <div class="flex items-center justify-between border-b border-amber-600/50 pb-1.5 mb-2 shrink-0">
        <h2 class="font-bold text-sm text-amber-200 flex items-center gap-1.5">
          <i data-lucide="hammer" class="w-4 h-4 text-amber-400"></i>
          土地營造：食衣住行育樂
        </h2>
        <button id="btnCloseBuild" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="text-[11px] text-slate-300 mb-2 shrink-0">消耗甘霖水滴，在這塊土地上重現歷史生活樣貌！</p>
      <div id="buildOptionsList" class="overflow-y-auto flex-1 space-y-2 pr-1"></div>
    </div>
  </div>

  <!-- 課文重點與錯題筆記視窗 -->
  <div id="modalNotebook" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/75 backdrop-blur-sm hidden">
    <div class="wood-board w-full max-w-lg max-h-[90dvh] flex flex-col rounded-2xl p-3.5 text-white shadow-2xl animate-pop">
      <div class="flex items-center justify-between border-b border-amber-600/50 pb-1.5 mb-2 shrink-0">
        <h2 class="font-bold text-sm text-amber-200 flex items-center gap-1.5">
          <i data-lucide="book-marked" class="w-4 h-4 text-amber-400"></i> 社會科筆記
        </h2>
        <button id="btnCloseNotebook" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="flex border-b border-slate-700 mb-2 text-xs shrink-0">
        <button id="tabSummary" class="flex-1 py-1.5 font-bold text-amber-400 border-b-2 border-amber-400 text-center">重點綱要</button>
        <button id="tabMistakes" class="flex-1 py-1.5 font-bold text-slate-400 text-center">錯題本 (<span id="mistakeBadge">0</span>)</button>
      </div>
      <div id="notebookContent" class="overflow-y-auto flex-1 space-y-2.5 pr-1 text-xs text-slate-200"></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 24 道精準全覆蓋題庫（逐條對照課本四圖，完全無死角）
       ========================================================================== */
    const QUESTION_BANK = [
      // 1-1 鳥瞰臺灣
      { id: 1, chapter: "1-1 鳥瞰臺灣", era: "geography", q: "臺灣本島的經緯度範圍大約位在何處？", options: ["東經 120°~122°、北緯 22°~25°", "東經 100°~105°、北緯 10°~15°", "西經 120°~122°、南緯 22°~25°", "東經 130°~135°、北緯 30°~35°"], ans: 0, explanation: "課本 1-1：臺灣大約位於東經 120 度至 122 度、北緯 22 度至 25 度之間。" },
      { id: 2, chapter: "1-1 鳥瞰臺灣", era: "geography", q: "橫穿臺灣中南部（嘉義、花蓮），作為熱帶與副熱帶分界線的重要緯線是？", options: ["赤道（0度）", "北回歸線（北緯 23.5度）", "南回歸線（南緯 23.5度）", "本初子午線"], ans: 1, explanation: "課本 1-1：北回歸線（北緯 23.5 度）橫穿嘉義與花蓮，是臺灣熱帶與副熱帶氣候分界線。" },
      { id: 3, chapter: "1-1 鳥瞰臺灣", era: "geography", q: "臺灣四面環海，其中臺灣島的「東側」面臨哪一個大洋？", options: ["太平洋", "臺灣海峽", "巴士海峽", "大西洋"], ans: 0, explanation: "課本 1-1：臺灣東臨太平洋、西臨臺灣海峽、南臨巴士海峽、北臨東海。" },
      { id: 4, chapter: "1-1 鳥瞰臺灣", era: "geography", q: "臺灣在地理位置上的重要戰略價值是什麼？", options: ["位於東亞島弧的樞紐，是國際海上交通與貿易要道", "是美洲與歐洲陸地唯一的交會點", "地處寒帶，是極地探險必經之地", "位居非洲大陸南端的航海通道"], ans: 0, explanation: "課本 1-1：臺灣位居東亞島弧樞紐，為國際貿易要道與候鳥遷徙生物匯聚的關鍵地帶。" },

      // 1-2 海中誕生的家園
      { id: 5, chapter: "1-2 海中誕生的家園", era: "geography", q: "臺灣島主要是由哪兩個板塊相互擠壓、隆起而形成的火山與褶皺島嶼？", options: ["菲律賓海板塊 與 歐亞板塊", "太平洋板塊 與 印澳板塊", "北美洲板塊 與 非洲板塊", "南極洲板塊 與 歐亞板塊"], ans: 0, explanation: "課本 1-2：數百萬年前由菲律賓海板塊與歐亞板塊互相擠壓隆起，至今地震仍頻繁。" },
      { id: 6, chapter: "1-2 海中誕生的家園", era: "geography", q: "臺灣面積最大（約占全島三分之二）的地形是哪一種？", options: ["山地", "平原", "台地", "盆地"], ans: 0, explanation: "課本 1-2：山地面積最大（約占三分之二），主要有中央、雪山、玉山、阿里山與海岸山脈。" },
      { id: 7, chapter: "1-2 海中誕生的家園", era: "geography", q: "四周地勢較高、中間低平的地形被稱為？例如臺北與臺中。", options: ["盆地", "平原", "丘陵", "台地"], ans: 0, explanation: "課本 1-2：四周高、中間低平為「盆地」（如臺北盆地、臺中盆地）。" },
      { id: 8, chapter: "1-2 海中誕生的家園", era: "geography", q: "坡度較緩，常見於山地外緣的地形是什麼？例如課本提到的哪一個地方？", options: ["丘陵（如苗栗丘陵）", "盆地（如臺北盆地）", "台地（如林口台地）", "平原（如嘉南平原）"], ans: 0, explanation: "課本 1-2：坡度較緩常見於山地外緣為「丘陵」，代表如苗栗丘陵。" },
      { id: 9, chapter: "1-2 海中誕生的家園", era: "geography", q: "頂部平坦、四周陡峭的地形稱為「台地」，課本中列舉了哪兩個著名代表？", options: ["林口台地、桃園台地", "苗栗丘陵、阿里山", "嘉南平原、屏東平原", "台北盆地、台中盆地"], ans: 0, explanation: "課本 1-2：頂部平坦四周陡峭為「台地」，課本代表例為林口台地、桃園台地。" },
      { id: 10, chapter: "1-2 海中誕生的家園", era: "geography", q: "金門和馬祖在早期與歐亞大陸相連，因海平面上升而分隔，屬於哪種島嶼類型？", options: ["大陸島", "火山島", "珊瑚礁島", "人工島"], ans: 0, explanation: "課本 1-2：金門、馬祖屬於「大陸島」；澎湖、綠島為火山島；小琉球為珊瑚礁島。" },
      { id: 11, chapter: "1-2 海中誕生的家園", era: "geography", q: "屏東外海的小琉球（琉球嶼）是由珊瑚礁碎屑堆積地殼隆起形成，屬於？", options: ["珊瑚礁島", "大陸島", "火山島", "沙洲島"], ans: 0, explanation: "課本 1-2：小琉球、東沙群島、南沙群島皆屬於「珊瑚礁島」。" },

      // 1-3 史前時代
      { id: 12, chapter: "1-3 史前時代（舊石器）", era: "paleolithic", q: "臺灣舊石器時代的代表文化是長濱文化與網形文化，當時人類已知道什麼重要技能？", options: ["已知用火，並住在天然洞穴中", "已經懂得煉鐵製造農具", "種植大量水稻與定居", "使用文字記錄祭祀"], ans: 0, explanation: "課本 1-3：舊石器時代已知用火、住洞穴，靠採集狩獵過著漂泊移居生活。" },
      { id: 13, chapter: "1-3 史前時代（舊石器）", era: "paleolithic", q: "舊石器時代長濱文化的先住民所使用的主要工具是什麼？", options: ["敲打製作的「打製石器」", "精細磨光的「磨製石器」", "鋒利的「青銅刀」與「鐵器」", "精美雕花的陶器"], ans: 0, explanation: "課本 1-3：舊石器時代使用敲打粗製的「打製石器」。" },
      { id: 14, chapter: "1-3 史前時代（新石器）", era: "neolithic", q: "新石器時代（大坌坑、卑南、圓山文化）人類生活最重要的轉變是什麼？", options: ["出現原始農業與畜牧，人類開始「定居」生活", "開始駕駛蒸氣輪船進行海外貿易", "發明了火藥與印刷術", "只能住在海蝕洞穴中依靠採集"], ans: 0, explanation: "課本 1-3：新石器時代出現農業畜牧，使人類告別漂泊，開始走向定居生活。" },
      { id: 15, chapter: "1-3 史前時代（新石器）", era: "neolithic", q: "新石器時代先住民為儲存、烹煮食物與水，發明並廣泛製作了什麼器具？", options: ["陶器（如繩紋陶）", "塑膠密封罐", "不鏽鋼保溫杯", "青銅鼎"], ans: 0, explanation: "課本 1-3：新石器時代已知製作陶器來儲存食物，工具亦演進為精細的「磨製石器」。" },
      { id: 16, chapter: "1-3 史前時代（金屬器）", era: "metal", q: "位於新北市八里區的「十三行文化」屬於金屬器時代，其最具代表性的工藝成就為？", options: ["已知「煉鐵」（使用鐵器）", "發明了電腦晶片", "使用打製的粗糙礫石", "尚未懂得使用火"], ans: 0, explanation: "課本 1-3：金屬器時代代表為十三行文化，已知煉鐵，並擁有更進步的農業。" },
      { id: 17, chapter: "1-3 史前時代（金屬器）", era: "metal", q: "在十三行文化遺址中發現了玻璃手鐲、青銅器與外來錢幣，這證實了當時具有什麼特色？", options: ["擁有發達繁榮的海上貿易活動", "當時完全不與外界任何島嶼接觸", "當時已經普遍使用智慧型手機", "完全沒有任何航海技術"], ans: 0, explanation: "課本 1-3：金屬器時代具有更發達的海上貿易商旅，交換外來玻璃珠與青銅器。" },

      // 2-1 島嶼上的子民
      { id: 18, chapter: "2-1 島嶼上的子民", era: "modern", q: "臺灣原住民族在語言與文化系統上，屬於世界上的哪一個語族？", options: ["南島語族", "印歐語族", "漢藏語族", "阿爾泰語族"], ans: 0, explanation: "課本 2-1：臺灣原住民族屬於南島語族，已在臺灣生活了數千年。" },

    /* ==========================================================================
       3. 存檔與重置
       ========================================================================== */
    const STORAGE_KEY = "TAIWAN_HIST_PAGAMO_V4_COMPLETE";
    let gameState = {
      era: "paleolithic",
      water: 2,
      streak: 0,
      mistakes: [],
      hexes: {
        "0,0": { q: 0, r: 0, owned: true, building: "cave", era: "paleolithic" }
      }
    };

    function loadGame() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) gameState = { ...gameState, ...JSON.parse(saved) };
      } catch (e) {}
      updateUI();
    }

    function saveGame() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {}
      updateUI();
    }

    function resetGame() {
      if (confirm("確定要重設紀錄，重新回到茫茫大海開拓嗎？")) {
        localStorage.removeItem(STORAGE_KEY);
        gameState = {
          era: "paleolithic",
          water: 2,
          streak: 0,
          mistakes: [],
          hexes: {
            "0,0": { q: 0, r: 0, owned: true, building: "cave", era: "paleolithic" }
          }
        };
        saveGame();
        drawMap();
      }
    }

    /* ==========================================================================
       4. 畫布繪製與六角網格系統
       ========================================================================== */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function getHexRadius() {
      return window.innerWidth < 640 ? 36 : 48;
    }

    function hexToPixel(q, r, cx, cy, radius) {
      const x = cx + radius * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
      const y = cy + radius * (3 / 2 * r);
      return { x, y };
    }

    const HEX_DIRECTIONS = [
      { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
      { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }
    ];

    function getAvailableTargets() {
      const targets = {};
      Object.keys(gameState.hexes).forEach(k => {
        const h = gameState.hexes[k];
        if (h.owned) {
          HEX_DIRECTIONS.forEach(d => {
            const nq = h.q + d.q;
            const nr = h.r + d.r;
            const nk = `${nq},${nr}`;
            if (!gameState.hexes[nk] || !gameState.hexes[nk].owned) {
              targets[nk] = { q: nq, r: nr };
            }
          });
        }
      });
      return targets;
    }

    function drawHex(ctx, x, y, radius, fill, stroke, lw = 2) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i + Math.PI / 6;
        const hx = x + radius * Math.cos(a);
        const hy = y + radius * Math.sin(a);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    }

    function drawBuilding(ctx, x, y, bType, r) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const emojiSize = r < 40 ? "16px" : "22px";
      const textSize = r < 40 ? "9px" : "11px";

      let icon = "🌾";
      let name = "沃土";
      if (bType === "cave") { icon = "⛰️"; name = "海蝕洞"; }
      else if (bType === "fire") { icon = "🔥"; name = "生火"; }
      else if (bType === "stilt_house") { icon = "🛖"; name = "高架屋"; }
      else if (bType === "pottery_kiln") { icon = "🏺"; name = "陶窯"; }
      else if (bType === "iron_forge") { icon = "⚒️"; name = "煉鐵"; }
      else if (bType === "trade_port") { icon = "⛵"; name = "商港"; }
      else if (bType === "civic_court") { icon = "⚖️"; name = "法庭"; }
      else if (bType === "rail_transit") { icon = "🚄"; name = "高鐵"; }

      ctx.font = `${emojiSize} sans-serif`;
      ctx.fillText(icon, x, y - (r < 40 ? 5 : 8));
      ctx.font = `bold ${textSize} sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.fillText(name, x, y + (r < 40 ? 10 : 14));
      ctx.restore();
    }

    let camera = { x: 0, y: 0 };
    let dragging = false;
    let dragStart = { x: 0, y: 0 };
    let hovered = null;

    function drawMap() {
      const radius = getHexRadius();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2 + camera.x;
      const cy = canvas.height / 2 + camera.y;

      // 海洋水波光影
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
      ctx.lineWidth = 1.5;
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(canvas.width / 3, y + 8, (canvas.width * 2) / 3, y - 8, canvas.width, y);
        ctx.stroke();
      }
      ctx.restore();

      const targets = getAvailableTargets();

      // 繪製可拓墾野地
      Object.keys(targets).forEach(k => {
        const { q, r } = targets[k];
        const { x, y } = hexToPixel(q, r, cx, cy, radius);
        const isHover = hovered && hovered.q === q && hovered.r === r && hovered.isTarget;

        drawHex(
          ctx, x, y, radius - 2,
          isHover ? "rgba(56, 189, 248, 0.45)" : "rgba(14, 116, 144, 0.35)",
          isHover ? "#38bdf8" : "rgba(56, 189, 248, 0.5)",
          isHover ? 3 : 1.5
        );

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = radius < 40 ? "13px sans-serif" : "16px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("⚔️", x, y - (radius < 40 ? 4 : 6));
        ctx.font = radius < 40 ? "9px sans-serif" : "10px sans-serif";
        ctx.fillStyle = "#bae6fd";
        ctx.fillText("拓墾", x, y + (radius < 40 ? 9 : 12));
        ctx.restore();
      });

      // 繪製已佔領土地
      Object.keys(gameState.hexes).forEach(k => {
        const h = gameState.hexes[k];
        if (!h.owned) return;
        const { x, y } = hexToPixel(h.q, h.r, cx, cy, radius);
        const isHover = hovered && hovered.q === h.q && hovered.r === h.r && !hovered.isTarget;

        let landColor = "#15803d";
        let strokeColor = "#4ade80";
        if (h.era === "paleolithic") { landColor = "#854d0e"; strokeColor = "#facc15"; }
        else if (h.era === "metal") { landColor = "#9a3412"; strokeColor = "#fb923c"; }
        else if (h.era === "modern") { landColor = "#1e40af"; strokeColor = "#60a5fa"; }

        drawHex(ctx, x, y + 3, radius - 1, "rgba(0,0,0,0.3)", null);
        drawHex(ctx, x, y, radius - 2, landColor, isHover ? "#ffffff" : strokeColor, isHover ? 3 : 1.8);
        drawBuilding(ctx, x, y, h.building, radius);
      });
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      drawMap();
    }
    window.addEventListener("resize", resizeCanvas);

    /* ==========================================================================
       5. 互動判定與事件
       ========================================================================== */
    function getHexAtPixel(px, py) {
      const radius = getHexRadius();
      const cx = canvas.width / 2 + camera.x;
      const cy = canvas.height / 2 + camera.y;

      for (let k in gameState.hexes) {
        const h = gameState.hexes[k];
        const { x, y } = hexToPixel(h.q, h.r, cx, cy, radius);
        if (Math.hypot(px - x, py - y) <= radius) return { ...h, isTarget: false };
      }

      const targets = getAvailableTargets();
      for (let k in targets) {
        const t = targets[k];
        const { x, y } = hexToPixel(t.q, t.r, cx, cy, radius);
        if (Math.hypot(px - x, py - y) <= radius) return { ...t, isTarget: true };
      }
      return null;
    }

    canvas.addEventListener("mousedown", e => {
      dragging = true;
      dragStart = { x: e.clientX - camera.x, y: e.clientY - camera.y };
    });

    window.addEventListener("mousemove", e => {
      if (dragging) {
        camera.x = e.clientX - dragStart.x;
        camera.y = e.clientY - dragStart.y;
        drawMap();
      } else {
        const rect = canvas.getBoundingClientRect();
        hovered = getHexAtPixel(e.clientX - rect.left, e.clientY - rect.top);
        drawMap();
      }
    });

    window.addEventListener("mouseup", () => dragging = false);

    canvas.addEventListener("click", e => {
      const rect = canvas.getBoundingClientRect();
      const h = getHexAtPixel(e.clientX - rect.left, e.clientY - rect.top);
      if (!h) return;
      playSfx("click");
      if (h.isTarget) openQuiz(h.q, h.r);
      else openBuild(h.q, h.r);
    });

    // 行動裝置手勢支援
    canvas.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        dragging = true;
        dragStart = { x: e.touches[0].clientX - camera.x, y: e.touches[0].clientY - camera.y };
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", e => {
      if (dragging && e.touches.length === 1) {
        camera.x = e.touches[0].clientX - dragStart.x;
        camera.y = e.touches[0].clientY - dragStart.y;
        drawMap();
      }
    }, { passive: true });

    canvas.addEventListener("touchend", () => dragging = false);

    /* ==========================================================================
       6. 答題與語音朗讀
       ========================================================================== */
    let curQuizTarget = null;
    let curQ = null;
    let voiceOn = true;

    function playSfx(type) {
      try {
        if (!Tone || Tone.context.state !== "running") Tone.start();
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -12;
        if (type === "correct") synth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
        else if (type === "wrong") synth.triggerAttackRelease(["Eb4", "D4"], "8n");
        else if (type === "click") synth.triggerAttackRelease(["C4"], "16n");
      } catch (err) {}
    }

    function speak(text) {
      if (!voiceOn || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-TW";
      u.rate = 0.95;
      const vs = window.speechSynthesis.getVoices();
      const tw = vs.find(v => v.lang.includes("zh-TW") || v.lang.includes("cmn-Hant-TW") || v.name.includes("Taiwan"));
      if (tw) u.voice = tw;
      window.speechSynthesis.speak(u);
    }

    function openQuiz(q, r) {
      curQuizTarget = { q, r };
      // 依當前時代優先抽該時代題目，並混合地理與多元族群/法治題
      const pool = QUESTION_BANK.filter(i => i.era === gameState.era || i.era === "geography" || i.era === "modern");
      curQ = pool[Math.floor(Math.random() * pool.length)];

      document.getElementById("quizChapterBadge").textContent = curQ.chapter;
      document.getElementById("quizEraHint").textContent = `【${ERA_CONFIG[gameState.era].name}】時空考驗`;
      document.getElementById("quizQuestion").textContent = curQ.q;

      const c = document.getElementById("quizOptions");
      c.innerHTML = "";
      curQ.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-2.5 rounded-xl bg-amber-900/40 hover:bg-amber-800/60 border border-amber-600/40 text-xs sm:text-sm text-amber-100 transition flex items-center gap-2";
        btn.innerHTML = `<span class="w-5 h-5 rounded-full bg-amber-600 flex items-center justify-center text-[10px] font-bold shrink-0">${['A', 'B', 'C', 'D'][idx]}</span> <span class="leading-tight">${opt}</span>`;
        btn.onclick = () => checkAnswer(idx);
        c.appendChild(btn);
      });

      const fb = document.getElementById("quizFeedback");
      fb.className = "hidden";
      document.getElementById("btnConfirmQuiz").classList.add("hidden");
      document.getElementById("modalQuiz").classList.remove("hidden");
      speak(curQ.q);
    }

    function checkAnswer(chosen) {
      const correct = chosen === curQ.ans;
      const fb = document.getElementById("quizFeedback");
      fb.classList.remove("hidden");

      const btns = document.getElementById("quizOptions").querySelectorAll("button");
      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === curQ.ans) b.className = "w-full text-left p-2.5 rounded-xl bg-emerald-600 border border-emerald-400 text-white text-xs sm:text-sm flex items-center gap-2";
        else if (i === chosen) b.className = "w-full text-left p-2.5 rounded-xl bg-red-600 border border-red-400 text-white text-xs sm:text-sm flex items-center gap-2";
      });

      if (correct) {
        playSfx("correct");
        gameState.streak++;
        gameState.water++;
        let bonus = "";
        if (gameState.streak >= 5) {
          gameState.streak = 0;
          gameState.water += 3;
          bonus = "🎉 連續答對 5 題！天降甘霖 +3 水滴！";
        }
        fb.className = "p-2.5 rounded-lg text-xs leading-relaxed bg-emerald-950/80 border border-emerald-500 text-emerald-200";
        fb.innerHTML = `<strong>答對了！成功拓墾領地！</strong><br>${curQ.explanation}<br><span class="text-amber-300 font-bold">${bonus}</span>`;
        speak(`答對了！${curQ.explanation}`);

        const k = `${curQuizTarget.q},${curQuizTarget.r}`;
        gameState.hexes[k] = { q: curQuizTarget.q, r: curQuizTarget.r, owned: true, building: "farm", era: gameState.era };

        // 升級時代檢測
        const ownedCount = Object.values(gameState.hexes).filter(h => h.owned).length;
        const cfg = ERA_CONFIG[gameState.era];
        if (cfg.next && ownedCount >= cfg.reqLands) {
          gameState.era = cfg.next;
          setTimeout(() => alert(`🌟 時代躍進！邁入【${ERA_CONFIG[cfg.next].name}】！`), 300);
        }

        saveGame();
        drawMap();
        document.getElementById("btnConfirmQuiz").classList.remove("hidden");
        document.getElementById("btnConfirmQuiz").textContent = "完成拓墾";
        document.getElementById("btnConfirmQuiz").onclick = () => document.getElementById("modalQuiz").classList.add("hidden");
      } else {
        playSfx("wrong");
        gameState.streak = 0;
        fb.className = "p-2.5 rounded-lg text-xs leading-relaxed bg-red-950/80 border border-red-500 text-red-200";
        fb.innerHTML = `<strong>答錯了！</strong><br>${curQ.explanation}`;
        speak(`答錯囉。${curQ.explanation}`);

        if (!gameState.mistakes.find(m => m.id === curQ.id)) {
          gameState.mistakes.push(curQ);
          saveGame();
        }
        document.getElementById("btnConfirmQuiz").classList.remove("hidden");
        document.getElementById("btnConfirmQuiz").textContent = "記入筆記並關閉";
        document.getElementById("btnConfirmQuiz").onclick = () => document.getElementById("modalQuiz").classList.add("hidden");
      }
      updateUI();
    }

    /* ==========================================================================
       7. 營造與筆記清單
       ========================================================================== */
    function openBuild(q, r) {
      const k = `${q},${r}`;
      const eraData = ERA_CONFIG[gameState.era];
      const c = document.getElementById("buildOptionsList");
      c.innerHTML = "";

      eraData.buildings.forEach(b => {
        const div = document.createElement("div");
        div.className = "p-2.5 rounded-xl bg-amber-900/30 border border-amber-600/40 flex items-center justify-between";
        div.innerHTML = `
          <div>
            <div class="font-bold text-amber-200 text-xs">${b.name}</div>
            <div class="text-[10px] text-slate-300">${b.benefit}</div>
          </div>
          <button class="px-2.5 py-1.5 rounded-lg bg-amber-600 text-xs font-bold text-white shrink-0 ${gameState.water < b.cost ? 'opacity-50' : ''}">
            ${b.cost} 滴水
          </button>
        `;
        div.querySelector("button").onclick = () => {
          if (gameState.water < b.cost) return alert("甘霖水滴不足！請先開墾野地答題累積。");
          gameState.water -= b.cost;
          gameState.hexes[k].building = b.type;
          gameState.hexes[k].era = gameState.era;
          playSfx("correct");
          saveGame();
          drawMap();
          document.getElementById("modalBuild").classList.add("hidden");
        };
        c.appendChild(div);
      });
      document.getElementById("modalBuild").classList.remove("hidden");
      lucide.createIcons();
    }

    const SUMMARY_TEXTS = [
      { t: "1-1 鳥瞰臺灣", c: "經緯度：東經120°~122°、北緯22°~25°。北回歸線(23.5°N)橫穿嘉義花蓮，為熱帶副熱帶分界。四周環海為東亞島弧樞紐。" },
      { t: "1-2 海中誕生", c: "菲律賓海板塊與歐亞板塊擠壓隆起。山地占2/3(五大山脈)。地形代表：苗栗丘陵、林口桃園台地、嘉南平原、臺北台中盆地。離島：金門馬祖為大陸島；澎湖為火山島；小琉球為珊瑚礁島。" },
      { t: "1-3 史前時代", c: "舊石器(長濱文化)：已知用火、住海蝕洞、敲打打製石器。新石器(大坌坑、卑南、圓山)：原始農業定居、繩紋陶器、磨製石器。金屬器(十三行)：高溫煉鐵、發達海上商貿與外來琉璃青銅。" },
      { t: "2-1 島嶼子民", c: "南島語族臺灣原住民。母系(阿美、卑南)、父系(泰雅、布農)、貴族(排灣、魯凱)。祭典：阿美豐年祭、賽夏矮靈祭、達悟飛魚祭；爭取還我土地運動。漢人帶來民間信仰(媽祖保生大帝)與宗祠族譜。" },
      { t: "2-2 社會規範與法", c: "風俗習慣、倫理道德、宗教信仰、法律。法律是唯一具有「國家強制力」的規範。現代推動國民法官落實民主法治。" }
    ];

    function renderNotebook(tab) {
      const c = document.getElementById("notebookContent");
      c.innerHTML = "";
      if (tab === "summary") {
        document.getElementById("tabSummary").className = "flex-1 py-1.5 font-bold text-amber-400 border-b-2 border-amber-400 text-center";
        document.getElementById("tabMistakes").className = "flex-1 py-1.5 font-bold text-slate-400 text-center";
        SUMMARY_TEXTS.forEach(s => {
          const d = document.createElement("div");
          d.className = "parchment p-2 rounded-xl text-slate-900";
          d.innerHTML = `<div class="font-bold text-amber-900 flex justify-between items-center mb-0.5"><span>${s.t}</span><button class="text-[10px] bg-amber-700 text-white px-1.5 py-0.5 rounded">朗讀</button></div><div class="text-[11px] leading-relaxed">${s.c}</div>`;
          d.querySelector("button").onclick = () => speak(`${s.t}。${s.c}`);
          c.appendChild(d);
        });
      } else {
        document.getElementById("tabSummary").className = "flex-1 py-1.5 font-bold text-slate-400 text-center";
        document.getElementById("tabMistakes").className = "flex-1 py-1.5 font-bold text-amber-400 border-b-2 border-amber-400 text-center";
        if (gameState.mistakes.length === 0) c.innerHTML = `<div class="text-center py-6 text-slate-400">目前沒有錯題紀錄！</div>`;
        else {
          gameState.mistakes.forEach(m => {
            const d = document.createElement("div");
            d.className = "p-2 rounded-xl bg-red-950/40 border border-red-500/40";
            d.innerHTML = `<div class="text-[10px] text-red-300 font-bold">${m.chapter}</div><div class="font-semibold text-xs text-white">${m.q}</div><div class="text-[11px] text-emerald-300 mt-1">正解：${m.options[m.ans]}</div>`;
            c.appendChild(d);
          });
        }
      }
    }

    function updateUI() {
      const owned = Object.values(gameState.hexes).filter(h => h.owned).length;
      document.getElementById("waterCount").textContent = gameState.water;
      document.getElementById("landCount").textContent = owned;
      document.getElementById("streakCount").textContent = `${gameState.streak}/5`;
      document.getElementById("currentEraBadge").textContent = ERA_CONFIG[gameState.era].name;
      document.getElementById("mistakeBadge").textContent = gameState.mistakes.length;
    }

    document.getElementById("btnToggleGuide").onclick = () => {
      document.getElementById("guidePopover").classList.toggle("hidden");
    };
    document.getElementById("btnReadQuestion").onclick = () => { if (curQ) speak(curQ.q); };
    document.getElementById("btnVoiceToggle").onclick = () => {
      voiceOn = !voiceOn;
      document.getElementById("btnVoiceToggle").innerHTML = `<i data-lucide="${voiceOn ? 'volume-2' : 'volume-x'}" class="w-3.5 h-3.5"></i>`;
      lucide.createIcons();
    };
    document.getElementById("btnReset").onclick = resetGame;
    document.getElementById("btnQuitQuiz").onclick = () => document.getElementById("modalQuiz").classList.add("hidden");
    document.getElementById("btnCloseBuild").onclick = () => document.getElementById("modalBuild").classList.add("hidden");
    document.getElementById("btnNotebook").onclick = () => {
      renderNotebook("summary");
      document.getElementById("modalNotebook").classList.remove("hidden");
      lucide.createIcons();
    };
    document.getElementById("btnCloseNotebook").onclick = () => document.getElementById("modalNotebook").classList.add("hidden");
    document.getElementById("tabSummary").onclick = () => renderNotebook("summary");
    document.getElementById("tabMistakes").onclick = () => renderNotebook("mistakes");

    window.addEventListener("DOMContentLoaded", () => {
      loadGame();
      resizeCanvas();
      lucide.createIcons();
    });
  </script>
</body>
</html>
